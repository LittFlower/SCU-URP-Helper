name: Build Windows EXE (Nuitka)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache Nuitka Compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      # [修正] 增加了 --assume-yes-for-downloads 解决非交互式下载卡死问题
      - name: Build exe with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --include-package-data=ddddocr `
            --output-filename=SCU-URP-Helper.exe `
            Main.py
        shell: pwsh

      - name: Prepare artifact
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exePath = Get-ChildItem -Recurse -Filter "SCU-URP-Helper.exe" | Select-Object -First 1
          if (-not $exePath) { throw "Executable not found after build." }
          Copy-Item -Path $exePath.FullName -Destination ".\dist\SCU-URP-Helper.exe" -Force
          if (Test-Path ".\config.json.example") {
              Copy-Item -Path ".\config.json.example" -Destination ".\dist\config.json" -Force
          }
          if (Test-Path ".\README.md") { Copy-Item -Path ".\README.md" -Destination ".\dist\README.md" -Force }
          if (Test-Path ".\README_CN.md") { Copy-Item -Path ".\README_CN.md" -Destination ".\dist\README_CN.md" -Force }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCU-URP-Helper-windows
          path: dist
